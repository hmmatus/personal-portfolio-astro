description:
  en: Colaborated with implementation of features for Multimoney app Android and IOS. Integration with crypto endpoints Paxos Gold. Mobile apps developed using JavaScript React Native Framework. Handled criticaldeployments and features completition in scheduled times. Task management using SCRUM agilemethodologies with JIRA. Implemented and managed information provided by APIS using fetch and Axios.Deployed production rollouts and control versions for IOS and Android. Repository Management (Git/Gitlab). CI/CD rollouts for React Native apps with Bitrise.
  es: Colaboré con la implementación de características para la aplicación Multimoney Android y IOS. Integración con endpoints crypto Paxos Gold. Aplicaciones móviles desarrolladas usando el Framework JavaScript React Native. Manejé despliegues críticos y finalización de características en tiempos programados. Gestión de tareas usando metodologías ágiles SCRUM con JIRA. Implementé y manejé información proporcionada por APIS usando fetch y Axios. Desplegué lanzamientos de producción y control de versiones para IOS y Android. Gestión de repositorios (Git/Gitlab). Lanzamientos CI/CD para aplicaciones React Native con Bitrise.
