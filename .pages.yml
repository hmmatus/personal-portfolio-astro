media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{fields.slug}.yaml"
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        description: Stable identifier, used as the filename. Do not change after creation.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers render first.
      - name: image
        label: Image
        type: image
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: type
            label: Link type
            type: select
            required: true
            options:
              values: [live-demo, github]
          - name: url
            label: URL
            type: string
            required: true
      - name: year
        label: Year
        type: string
        required: true
      - name: role
        label: Role
        type: object
        fields:
          - name: en
            label: English
            type: text
          - name: es
            label: Español
            type: text
      - name: title
        label: Title
        type: object
        fields:
          - name: en
            label: English
            type: text
            required: true
          - name: es
            label: Español
            type: text
            required: true
      - name: description
        label: Description
        type: object
        fields:
          - name: en
            label: English
            type: text
            required: true
          - name: es
            label: Español
            type: text
            required: true
    view:
      primary: title.en
      fields: [image, order, year, tags]

  - name: experience
    label: Experience
    type: collection
    path: src/content/experience
    filename: "{fields.slug}.yaml"
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        description: Stable identifier, used as the filename. Do not change after creation.
      - name: startDate
        label: Start date
        type: date
        required: true
      - name: endDate
        label: End date
        type: date
        description: Required unless "Current role" is checked.
      - name: isCurrent
        label: Current role
        type: boolean
      - name: title
        label: Title
        type: object
        fields:
          - name: en
            label: English
            type: text
            required: true
          - name: es
            label: Español
            type: text
            required: true
      - name: company
        label: Company
        type: object
        fields:
          - name: en
            label: English
            type: text
            required: true
          - name: es
            label: Español
            type: text
            required: true
      - name: description
        label: Description
        type: object
        fields:
          - name: en
            label: English
            type: text
            required: true
          - name: es
            label: Español
            type: text
            required: true
    view:
      primary: company.en
      sort: startDate
      fields: [title.en, startDate, endDate]

  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: "{fields.title}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: banner
        label: Banner image
        type: image
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: body
        label: Body
        type: rich-text
    view:
      primary: title
      sort: date
      fields: [date, description]

settings:
  merge: direct
